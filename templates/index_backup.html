<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Resistor Detector</title>

    <style>

        body {

            font-family: Arial, sans-serif;

            background: #f2f5f9;

            margin: 0;

            padding: 0;

            display: flex;

            justify-content: center;

            align-items: center;

            min-height: 100vh;
        }

        .container {

            background: white;

            padding: 40px;

            border-radius: 20px;

            box-shadow: 0 5px 20px rgba(0,0,0,0.1);

            width: 500px;

            text-align: center;
        }

        h1 {

            color: #222;
        }

        form {

            margin-top: 20px;
        }

        input[type="file"] {

            margin-bottom: 20px;
        }

        button {

            background: #4f46e5;

            color: white;

            border: none;

            padding: 12px 24px;

            border-radius: 10px;

            cursor: pointer;

            font-size: 16px;
        }

        button:hover {

            background: #4338ca;
        }

        img {

            margin-top: 20px;

            width: 300px;

            border-radius: 10px;

            border: 2px solid #ddd;
        }

        .result-box {

            margin-top: 25px;

            background: #f8fafc;

            padding: 20px;

            border-radius: 15px;
        }

        .bands {

            color: #444;

            font-size: 18px;
        }

        .resistance {

            color: #111827;

            font-size: 32px;

            font-weight: bold;

            margin-top: 10px;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>AI Resistor Detector</h1>

        <p>
            Upload resistor image for automatic detection
        </p>

        <form method="POST"
              enctype="multipart/form-data">

            <input type="file"
                   name="image"
                   required>

            <br>

            <button type="submit">

                Detect Resistor

            </button>

        </form>

        {% if image %}

            <img src="{{ image }}">

        {% endif %}

        {% if bands %}

            <div class="result-box">

                <h2>Detected Bands</h2>

                <div class="bands">

                    {{ bands }}

                </div>

                {% if result %}

                    <div class="resistance">

                        {{ result }}

                    </div>

                {% endif %}

            </div>

        {% endif %}

    </div>

</body>

</html>
